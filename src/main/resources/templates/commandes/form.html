<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Liste des Commandes</h2>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Client</th>
        <th>Produit</th>
        <th>Quantité</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="commande : ${commandes}">
        <td th:text="${commande.id}"></td>
        <td th:text="${commande.dateCommande}"></td>
        <td th:text="${commande.client.nom}"></td>
        <td th:text="${commande.produit.nom}"></td>
        <td th:text="${commande.quantite}"></td>
    </tr>
    </tbody>
</table>

<h3 class="mt-5">Ajouter une Commande</h3>

<form th:action="@{/commandes/save}" method="post" class="row g-3">
    <div class="col-md-4">
        <label class="form-label">Client</label>
        <select class="form-select" name="clientId" required>
            <option th:each="client : ${clients}"
                    th:value="${client.id}"
                    th:text="${client.nom}">
            </option>
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Produit</label>
        <select class="form-select" name="produitId" required>
            <option th:each="produit : ${produits}"
                    th:value="${produit.id}"
                    th:text="${produit.nom}">
            </option>
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Quantité</label>
        <input type="number" name="quantite" class="form-control" required>
    </div>
    <div class="col-12">
        <button class="btn btn-success">Enregistrer</button>
    </div>
</form>

</body>
</html>
