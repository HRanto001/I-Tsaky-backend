<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:fragment="content">
    <h2>Liste des Produits</h2>

    <a class="btn btn-primary mb-3" th:href="@{/produits/new}">+ Ajouter un produit</a>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produits}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nom}"></td>
            <td th:text="${p.categorie}"></td>
            <td th:text="${p.prixUnitaire}"></td>
            <td th:text="${p.stockDisponible}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{|/produits/edit/${p.id}|}">Modifier</a>
                <a class="btn btn-sm btn-danger" th:href="@{|/produits/delete/${p.id}|}">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
